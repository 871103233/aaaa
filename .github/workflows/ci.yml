name: CI

# Pipeline: gate -> build -> test. Stops at the first failing step.
# Keep this file ASCII-only (same convention as the CI scripts in this repo,
# which are ASCII-only to avoid PowerShell 5.1 encoding problems).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 1) structural gate (runs first) ----------
  gate-linux:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for banned identifiers
        shell: pwsh
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -RepoRoot .

      - name: Gate rule self-test
        shell: pwsh
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -SelfTest

  gate-windows:
    name: Gate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for banned identifiers
        shell: powershell
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -RepoRoot .

      - name: Gate rule self-test
        shell: powershell
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -SelfTest

  # ---------- 2) build + 3) test ----------
  # ASAN and TSan are mutually exclusive, hence two separate presets.
  build:
    needs:
      - gate-linux
      - gate-windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: debug
            compiler: msvc
          - os: windows-latest
            preset: release
            compiler: msvc
          - os: ubuntu-latest
            preset: asan
            compiler: clang
          - os: ubuntu-latest
            preset: tsan
            compiler: clang
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libvulkan-dev autoconf autoconf-archive automake libtool

      - name: Select clang
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # Ninja + MSVC needs the VS developer environment (cl.exe on PATH).
      # The hosted Windows runner does not have it by default.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        shell: bash
        run: |
          if [ -z "$VCPKG_INSTALLATION_ROOT" ]; then
            echo "vcpkg is not preinstalled on this runner" >&2
            exit 1
          fi
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # The vcpkg preinstalled on hosted runners is a shallow clone whose work tree
      # (ports/ and versions/) is older than the pinned baseline. vcpkg reads ports and
      # the version database from that work tree while reading baseline.json at the
      # pinned commit, so this mismatch aborts the install with messages such as
      #   error: no version database entry for expat at 2.8.5
      # (and, before the commit was even present, with
      #   failed to `git show` versions/baseline.json ).
      # Fetch AND check out the pinned commit so the clone is self-consistent.
      # The SHA is read from vcpkg.json so that file stays the single source of truth.
      - name: Align vcpkg with pinned baseline
        shell: bash
        run: |
          BASELINE=$(grep -o '"builtin-baseline"[[:space:]]*:[[:space:]]*"[0-9a-f]*"' vcpkg.json | grep -o '[0-9a-f]\{40\}')
          echo "pinned baseline: $BASELINE"
          if [ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$BASELINE" ]; then
            echo "runner vcpkg is already at the pinned baseline"
          else
            git -C "$VCPKG_ROOT" fetch --depth=1 origin "$BASELINE" || git -C "$VCPKG_ROOT" fetch --unshallow
            # The runner image's clone carries local modifications (seen on ubuntu-latest:
            # "Your local changes to the following files would be overwritten by checkout"),
            # so a plain checkout is refused. -f discards them (also clearing untracked files
            # that would obstruct the switch). The runner is ephemeral, so this is safe.
            git -C "$VCPKG_ROOT" checkout -f --detach FETCH_HEAD
          fi
          git -C "$VCPKG_ROOT" rev-parse HEAD
          git -C "$VCPKG_ROOT" cat-file -e "$BASELINE:versions/baseline.json"
          echo "runner vcpkg is now consistent with the pinned baseline"

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
