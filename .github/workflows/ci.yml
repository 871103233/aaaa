name: CI

# Pipeline: gate -> build -> test. Stops at the first failing step.
# Keep this file ASCII-only (same convention as the CI scripts in this repo,
# which are ASCII-only to avoid PowerShell 5.1 encoding problems).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 1) structural gate (runs first) ----------
  gate-linux:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for banned identifiers
        shell: pwsh
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -RepoRoot .

      - name: Gate rule self-test
        shell: pwsh
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -SelfTest

  gate-windows:
    name: Gate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for banned identifiers
        shell: powershell
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -RepoRoot .

      - name: Gate rule self-test
        shell: powershell
        run: ./.trae/skills/voxel-engine-dev-standards/scripts/check-banned-identifiers.ps1 -SelfTest

  # ---------- 2) build + 3) test ----------
  # ASAN and TSan are mutually exclusive, hence two separate presets.
  build:
    needs:
      - gate-linux
      - gate-windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: debug
            compiler: msvc
          - os: windows-latest
            preset: release
            compiler: msvc
          - os: ubuntu-latest
            preset: asan
            compiler: clang
          - os: ubuntu-latest
            preset: tsan
            compiler: clang
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libvulkan-dev

      - name: Select clang
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # Ninja + MSVC needs the VS developer environment (cl.exe on PATH).
      # The hosted Windows runner does not have it by default.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        shell: bash
        run: |
          if [ -z "$VCPKG_INSTALLATION_ROOT" ]; then
            echo "vcpkg is not preinstalled on this runner" >&2
            exit 1
          fi
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # vcpkg resolves the manifest baseline with `git show <sha>:versions/baseline.json`.
      # The vcpkg preinstalled on hosted runners is a shallow clone, so a pinned baseline
      # that is not that clone's HEAD cannot be resolved and `vcpkg install` aborts before
      # building a single port (this is what made every run fail in ~2 seconds).
      # Fetch the pinned baseline into the clone first. The SHA is read from vcpkg.json so
      # that file stays the single source of truth.
      - name: Fetch pinned vcpkg baseline
        shell: bash
        run: |
          BASELINE=$(grep -o '"builtin-baseline"[[:space:]]*:[[:space:]]*"[0-9a-f]*"' vcpkg.json | grep -o '[0-9a-f]\{40\}')
          echo "pinned baseline: $BASELINE"
          if git -C "$VCPKG_ROOT" cat-file -e "$BASELINE:versions/baseline.json" 2>/dev/null; then
            echo "baseline already resolvable in the runner vcpkg clone"
          else
            git -C "$VCPKG_ROOT" fetch --depth=1 origin "$BASELINE" || git -C "$VCPKG_ROOT" fetch --unshallow
          fi
          git -C "$VCPKG_ROOT" cat-file -e "$BASELINE:versions/baseline.json"
          echo "baseline is now resolvable"

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
