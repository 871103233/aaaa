# 弹丸规格表（T27：光球）
#
# 依据：docs/game-design.md §2.3（玩家能力：发射弹丸 / 破坏地形）与 ADR 0005（TOML + toml++，
#       启动期一次性加载，非法即抛异常、**不静默回退**）。本表是"发射出来的是什么"的**唯一事实来源**：
#       game/main.cpp 据 `DefaultProjectile()` 取弹道与爆炸参数，**禁止**在别处另写一份常量。
#
# 权威解释在代码：字段语义、单位与校验规则见 world/dig/projectile_table.hpp。
#
# 多类型扩展：`[[projectile]]` 是**数组**，将来加新弹种只需追加条目（`id` 唯一）；
#   当前只有 `light_orb` 一种，且 `game/` 固定发射表中第一项（多类型选择未做，见阶段计划）。
#
# 单位：
#   radius / explosion_radius / explosion_depth / explosion_rim = 格；
#   speed = 格 / 秒；lifetime / fire_interval = 秒；
#   gravity_scale = **角色重力的倍数**（角色重力 24 格/秒²，见 game/main.cpp 的 kGravity）；
#   emissive = 自发光颜色（**线性光**，可 > 1：该值会经 HDR + 色调映射通路呈现"发光"）。
#
# 版本历史：v1 首版（T27）；v2 每条 `[[projectile]]` 新增**必填** `damage`（T31 / ADR 0013）。

schema_version = 2

# 同时存在的弹丸数上限（光球池容量；池满时新发射被忽略，不淘汰已有弹丸）。
max_active = 16

[[projectile]]
id = "light_orb"

# 弹丸渲染半径（格）：程序化球体网格的半径。
radius = 0.6

# 初速（格/秒）。42 格/秒 下 50 格距离约飞行 1.2 秒、下坠约 17 格 ⇒ 需要抬枪瞄准，
# 重力感明显但不至于打不中（这是"受重力影响"可被肉眼验证的原因）。
speed = 42.0

# 重力系数（× 角色重力 24 格/秒²）。1.0 = 与角色相同的重力；0 = 直线弹道（调试用）。
gravity_scale = 1.0

# 存活时间（秒）：超时未命中则消失（防止无限飞行、也限制池占用）。6 秒 ≈ 252 格射程。
lifetime = 6.0

# 连发冷却（秒）：按住左键时的最小发射间隔。0.3 秒 ≈ 每秒 3.3 发。
fire_interval = 0.30

# ---- 命中后的破坏 ----
# **伤害**（点，必须 ≥ 0）—— T31 / ADR 0013：区域内（可挖体积）的破坏预算是
#   `damage × destruction.toml 的 points_per_cubic_block`（点），**逐格³ 扣减**该格材质的 toughness
#   ⇒ 同一发球在泥 / 岩 / 混合材质处挖出的腔体不同。`damage = 0` = 不造成破坏。
#   锚点（ADR 0013 §二.4，换算系数 271）：纯泥土 r ≈ 6 格、纯岩石 r ≈ 5.06 格。
damage = 10.0

# 爆炸半径（格）：**区域外**作为地表爆破坑的半径；**区域内**作为体积挖除的**候选范围上界**
#   （真正的挖除范围由伤害预算决定，故岩体里挖出的腔体会比它小）。
#
# **2026-09-29（T71 性能诊断，所有者裁定"改默认值"）：6.0 → 4.0**。
#   依据（debug 实测，同一段输入序列的三档对照：`build/perf/*.log`、`docs/devlog.md`）：
#   `CarveByDamage` 的**候选格数按半径三次方增长**，故本值是"每发挖洞当帧成本"最直接的旋钮 ——
#   半径 6.0 ⇒ 单发"挖除"平均 **33.10 ms** / 峰值 43.47 ms；半径 4.0 ⇒ **13.45 ms** / 17.47 ms（**−59%**）。
#   **代价**：草地里的腔体半径被本值钳到 4 格（体积约为原来的 1/3）—— 注意此时**伤害预算不再是用尽的约束**
#   （`damage = 10` 在草 / 土上够挖到 r ≈ 6.9），故**伤害数值本身未改**：对器物与后续战斗语义仍是 10。
#   **何时可改回**（任一）：① release 复测显示"挖除"已远低于帧预算；② 候选枚举 / 材质查询被优化或下沉到工作线程；
#   ③ 手感上嫌坑太小 ⇒ 先试 **5.0**（按实测模型 `cost ≈ 5.2 + 0.129·r³` 估算 ≈ 21 ms）。
explosion_radius = 4.0

# 地表爆破的坑心下挖深度（格）与外环隆起（格）——仅在爆炸点**不在**可挖区域内时生效。
#   剖面口径与 brush.toml 的爆破一致（坑体收口 + 外环抛土），但**两表互不引用**：这是两套独立能力。
explosion_depth = 6.0
explosion_rim = 2.0

# 衰减带占半径的比例 ∈ (0, 1]：越大越平缓（仅地表爆破使用；体积挖除的球面本身即光滑面）。
explosion_falloff = 0.6

# 自发光颜色（线性光，每通道 ≥ 0）。暖白且 > 1 ⇒ 经 ACES 色调映射后呈"发光的光球"。
emissive = [1.60, 1.25, 0.65]
