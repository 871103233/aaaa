# 塌落（破坏后的支撑失效）规则表（T29 起 / T33 修订）
#
# 依据：docs/adr/0015-structure-units-and-rigid-collapse.md（2026-09-27 修订：**统一连通分量刚体化**，
#       删除逐列下落）；docs/game-design.md §2.3 的连带必做项「结构塌陷（支撑缺失 ⇒ 上部倒塌）」。
#
# 本表是**塌落规则参数**的唯一事实来源：启动期一次性加载，非法即抛异常、**不静默回退**
# （口径同 materials / lighting / brush / projectiles）。
#
# 规则口径（权威解释在代码：world/dig/volume_collapse.hpp；**scope 由 ADR 0018 决策一定案**）：
#   爆炸挖除后，在**以被改动采样为起点的实心连通域**内做**一次**"支撑检查"
#   （T49 起 scope = 连通域，不再是"被改动采样周围一个固定窗口"—— 固定窗口下距破坏点超过窗口的
#    远端中段从不进入求解，长条两端支点都被炸断后中段会永远悬空）：
#     ① 「支撑体素」= **载荷能沿实心一路传到地底**的实心体素：先看**纵向**（自下而上连续实心，
#        邻域底面视作地面），再把"接地"沿**同一高度层的实心连通**横向传播 `max_cantilever_blocks` 步
#        （这一步就是悬挑 / 拱效应：离接地处不超过该跨度的岩体仍算有支撑）；
#     ② 其余实心体素即**失去支撑** ⇒ 按 **6 邻域连通分量**分组，**每个分量 = 一个整体**，
#        再按**材质一致性**切成**子块**（T50 / ADR 0018 决策四：岩子块保留几何体、土子块回写融合）；
#        整体从体积中抽出（变空）后转成 **Jolt 动态刚体**（凸包）⇒ 由物理求解**倾斜 / 旋转 / 碰撞**，
#        落定后按材质分流：**散体体素化回写**成地形（残骸可继续挖、可站上去），**刚性保留几何体**。
#
# 单位：长度 = 格（= 体素边长）；质量 = 格³；角度 = 弧度。真实世界的直觉参照：悬臂梁 / 拱的无支撑跨度
# 超过约 8 格就会折断，故默认取 4 格"悬挑半径"（≈ 8 格跨度）。
#
# 版本历史：v1 首版（T29）；v1 修订（T30，schema_version 不变）—— 邻域口径从"被挖块 ±1 块 × 整个体积高度"
#           改为"被改动采样范围 ± (悬挑 + 1) 格 × 块级填充分类的竖直范围"。
#           **v2（T33，2026-09-27）**—— 删除 `pile_spread_blocks`（不再有"逐列摊开"），
#           新增刚体化倒塌参数（质量 / 摩擦 / 落定阈值 / 初始不对称 / 活跃上限）。
#           **v3 修订（T49，2026-09-27，schema_version 不变）**—— scope 由"固定窗口"改为
#           "**实心连通域**（窗口只在超上限时作为回退）"；**判据与全部数值一字未改**。

schema_version = 3

# 是否启用塌落。关闭时爆炸只挖不塌（用于对比测试）。
enabled = true

# **悬挑上限**（格）：实心体素到最近「支撑体素」的水平距离超过它即视为失去支撑。
# 必须 ≥ 0。取 0 ⇒ 只要正下方为空就塌（最激进）。
max_cantilever_blocks = 4.0

# **起始**窗口（水平 = 被改动采样范围外扩"悬挑 + 1"格；竖直 = 自种子块向下到最低的非全实心块、
# 向上到最高的非全空块）**之外**再额外外扩几个块（1 块 = 32 格）。必须 ≥ 0。
# 默认 0 = 只取派生范围作为**起点**；调大 = 起点更宽（更保守但更慢）。
# 注意（T49）：窗口不再决定 scope —— 连通域触到窗口的水平边界时窗口会**只向那一侧翻倍扩张**，
# 直到把整个连通域包住（或撞上 `kMaxRegionSamples` 8M 的累计上限 ⇒ 告警 + 回退这个固定窗口）。
neighborhood_margin_blocks = 0

# ---- T33 / T43：刚体化倒塌 ----
#
# **质量 / 摩擦 / 弹性不在这里**：它们由 `assets/config/materials.toml` 的**材质物理参数**决定
# （T43 / ADR 0016：石 ≠ 土 ≠ 草 ≠ 沙）。曾经的全局 `mass_per_voxel` / `friction` 已删除，
# 避免"两处事实来源"漂移。

# **落定判据**：线速度（格/秒）低于它、且角速度（rad/s）低于下面那个值，**连续** `settle_steps` 个
# 固定步 ⇒ 判定"倒了、停住了"，随即**体素化回写**为地形并销毁刚体。
settle_linear_speed  = 0.6
settle_angular_speed = 0.7
settle_steps         = 12

# **初始角速度**（rad/s，≥ 0）：真实结构失稳总是**不对称**的（一侧先屈服）。**仅在无爆心冲量时**使用
# （`impulse_speed = 0`，或该次倒塌不是爆炸引起）：那时若初速恒为零，细长的塔只会"原地垂直落下"而不倒。
# 有冲量时冲量本身就是真实的不对称来源，此值**不叠加**。0 = 关闭（用于测试"只有外力才会倾倒"）。
initial_tilt_speed = 0.9

# **爆心冲量速度**（格/秒，≥ 0；0 = 关闭）：爆炸挖除导致倒塌时，碎块按"离爆心越近越快"获得初速，
# 方向自爆心向外（线性衰减：`1 − 距离 / 爆炸半径`），并由此产生**翻滚**（角速度，ADR 0016 决策一）。
# 这是"被炸飞"与"垂直掉下来"的区别；数值越大越猛烈。⚠ 需要弹丸表提供爆炸半径（区域内爆炸才有）。
impulse_speed = 8.0

# **小碎片清除阈值**（体素数，≥ 0；0 = 关闭清除）：失去支撑的连通分量若体素数 ≤ 它 ⇒ **直接清除**
# （"当炸没了"：不生成刚体、不回写、不占地形）。守卫：分量只要含 `indestructible` 材质（见
# materials.toml）就**不删**，按常规流程处理。⚠ 清除意味着质量不守恒（ADR 0016 后果 2 已登记）。
debris_delete_max_voxels = 24

# **同时活跃的倒塌整体上限**（≥ 1）：每个活跃刚体占一个"动态网格池"槽位（见 game/main.cpp）。
# 超出上限的分量**本次不抽出、保持原状**（宁可"这次没倒"，也不让体素被抽出后凭空消失），并打日志。
# 注意：**小碎片清除**（上面的阈值）是另一条路径 —— 那条是"故意让它消失"。
max_active_units = 4
