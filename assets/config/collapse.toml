# 塌落（破坏后的支撑失效）规则表（T29）
#
# 依据：docs/adr/0012-collision-takeover-by-volumes.md 第二节；`docs/game-design.md` §2.3 的
#       连带必做项「结构塌陷（支撑缺失 ⇒ 上部倒塌）」。
#
# 本表是**塌落规则参数**的唯一事实来源：启动期一次性加载，非法即抛异常、**不静默回退**
# （口径同 materials / lighting / brush / projectiles）。
#
# 规则口径（权威解释在代码：world/dig/volume_collapse.hpp）：
#   爆炸挖除后，在**被改动采样周围**的邻域内做**一次**"支撑检查"：
#     ① 「支撑体素」= **载荷能沿实心一路传到地底**的实心体素：先看**纵向**（自下而上连续实心，
#        邻域底面视作地面），再把"接地"沿**同一高度层的实心连通**横向传播 `max_cantilever_blocks` 步
#        （这一步就是悬挑 / 拱效应：离接地处不超过该跨度的岩体仍算有支撑）；
#     ② 其余实心体素即**失去支撑** ⇒ 沿本列**下落**到腔底，并在落点堆成碎堆。
#
# 单位：长度 = 格（= 体素边长）。真实世界的直觉参照：悬臂梁 / 拱的无支撑跨度超过约 8 格就会折断，
# 故默认取 4 格"悬挑半径"（≈ 8 格跨度）。
#
# 版本历史：v1 首版（T29）；v1 修订（T30，schema_version 不变）—— 邻域口径从"被挖块 ±1 块 × 整个体积高度"
#           改为"被改动采样范围 ± (悬挑 + 摊开 + 1) 格 × 块级填充分类"，故 `neighborhood_margin_blocks`
#           的默认值由 1 改为 0（它现在只表示"在派生范围之外再额外外扩的块数"）。

schema_version = 1

# 是否启用塌落。关闭时爆炸只挖不塌（用于对比测试）。
enabled = true

# **悬挑上限**（格）：实心体素到最近「支撑体素」的水平距离超过它即视为失去支撑。
# 必须 ≥ 0。取 0 ⇒ 只要正下方为空就塌（最激进）。
max_cantilever_blocks = 4.0

# 落点碎堆的**摊开幅度**（格，0~2）：下落堆积后，按确定性哈希把堆顶的若干体素推给相邻列，
# 让堆面起伏像碎石而不是机械的平板。0 = 不摊开（堆面平整）。**质量守恒**在任何取值下都成立。
pile_spread_blocks = 1

# 在**派生邻域**（水平 = 被改动采样范围外扩"悬挑 + 摊开 + 1"格；竖直 = 自种子块向下到最低的非全实心块、
# 向上到最高的非全空块）**之外**再额外外扩几个块（1 块 = 32 格）。必须 ≥ 0。
# 默认 0 = 只取派生范围（实测邻域 ≈ 3 万采样、单次爆炸的塌落 < 1 ms）；调大 = 更保守但更慢
# （例如把"一次爆炸能提醒到的范围"扩到邻近的块柱）。
neighborhood_margin_blocks = 0
