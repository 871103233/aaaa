# 全局破坏表（T31 / ADR 0013：材质坚固度 × 伤害预算）
#
# 依据：docs/adr/0013-destructible-elements.md §二 / §四、ADR 0005（TOML + toml++，
#       启动期一次性加载，非法即抛异常、**不静默回退**）。
# 权威解释在代码：字段语义与校验规则见 world/dig/destruction_table.hpp。
#
# 破坏预算的构成（单位为「点」）：
#     预算 = damage（projectiles.toml，点） × points_per_cubic_block（本表）
#   自爆心向外**逐格³**消耗该格材质的 toughness（materials.toml，点/格³）；
#   余额不足以破坏下一格 ⇒ 立即停止（该格及其更远者保留）⇒ 同一发球在泥 / 岩 / 混合材质处结果不同。
#
# 版本历史：v1 首版（T31）。

schema_version = 1

# 换算系数（格³/点 的倒数语义见 ADR 0013 §二.4）：**单一手感旋钮** —— 改它即可整体调"破坏力"，
# 不必改材质表。271 = 保留"伤害 10 / 泥 3 / 岩 5"这组直觉数字、同时保持既有手感（泥 r≈6 格）。
points_per_cubic_block = 271.0

# ---- 固定器物（层 ③，尚未建；字段先落表以避免器物落地时再升 schema_version）----
# 器物破坏阈值（点）：累计伤害 ≥ 本值 ⇒ Intact → Broken；0 = 单发命中即破。
# `destructible = false` 的器物无视该阈值（ADR 0013 §三.5）。
prop_damage_threshold = 0.0

# 器物被破坏后的**占位表现色**（线性 RGB，各通道 ∈ [0,1]）。
# 本阶段预制外观留白 ⇒ 仅把外表整体变黑以便玩家区分"已被破坏"；
# 美术预制外观就绪后替换表现层实现，**不改逻辑**（ADR 0013 §三.6）。
prop_broken_tint = [0.05, 0.05, 0.05]
