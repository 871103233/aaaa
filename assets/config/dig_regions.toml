# 可挖区域标记表（数据文件部分）
#
# 依据：docs/adr/0006-diggable-region-marking.md（标记 = **程序化规则 + 数据文件叠加**；
#       本文件是其中的**数据文件**部分）与 ADR 0004 硬约束 2（**标记区域之外不可三维挖掘**）。
#
# 本轮状态（见 docs/plans/v0.1.md 的 T8 降级项）：**程序化规则部分尚未实现**，
#   ⇒ 本文件是**唯一**的可挖区域来源。文件缺失时按 ADR 0006 返回空表（不报错，即"哪里都不能挖"）。
#
# 权威解释在代码：字段语义、吸附规则与校验见 world/dig/dig_region.hpp。
#
# 字段：
#   name     区域名（用于日志与报错定位）
#   mode     "diggable" = 区域内可三维挖掘；"sealed" = 区域内强制不可挖（**覆盖**低优先级的 diggable）
#   priority 大者优先；同优先级时**文件顺序在后者**优先
#   min/max  世界坐标（格）的**闭区间**（口径与 assets/maps/*.toml 的地形编辑一致）
#
# 重要口径 —— **吸附**：体积块必须与固定网格对齐（ADR 0004 硬约束 3），故 min/max 装载时按 32 格
#   **向外吸附**到块边界 ⇒ **实际生效的区域是所给范围的"块对齐超集"**。
#   把 max 写成"块边界 − 1"（如 127 = 128 − 1）即可避免多吞一个块。
#
# 垂直范围：必须落在世界高度范围 0 ~ 512 格内（ADR 0008）。
# 块数上限：全部可挖块之和 ≤ 512（DigRegionTable::kMaxTotalBlocks），超出即报错。
#
# 版本历史：v1 首版（T8，只标一处"山体"）；v1 现值 = **整张测试地图的地表都可挖**（见下）。

schema_version = 1

# ---------------------------------------------------------------------------
# 整张测试地图的地表都可挖（人工反馈："只有新增的那一柱可以挖，希望整张 demo 地面都能挖"）
# ---------------------------------------------------------------------------
#
# 覆盖范围 = **已加载世界的全部地表列 + 全部相关高度**：
#   - 水平：地图 tile 半径 [1, 1]（assets/maps/test_range.toml）⇒ tile 覆盖世界列 `[-64, 128]`（**含共享边界列 128**）；
#     按 32 格块**向外吸附**后为块 x ∈ [-2, 4]、z ∈ [-2, 4]（各 7 块）。
#     **为什么必须含边界列 128**：地表四边形的判据是"四角全部可挖"（ADR 0011），
#     若区域止于 127，则每一块 tile 最外一圈四边形仍由**地表网格**绘制 ⇒ 这些 tile 会保留
#     **地表高度场碰撞体**（ADR 0012 的接管判据），于是"洞口可见但走不进去"重现。
#     含 128 后全部地表四边形都可挖 ⇒ 地表网格为空、碰撞整体交给体积。
#   - 垂直：y ∈ [0, 288)。本图的地表高度落在 **6 ~ 260 格**（噪声 `128 ± 122`；最高点是地标塔 260），
#     故 288 高出最高地表 28 格，留出空中命中走体积的余量，又不浪费完全实心的深层块。
#   ⇒ 7 × 9 × 7 = **441 块**（密度数据约 15.1 MB），在 512 块上限内。
#     其中 x / z 的第 4 号块有一半落在世界之外（世界止于 128），属"为对齐块网格而多吞"的部分。
#
# 为什么要铺满整张地图，而不是只圈几个测试区：
#   ① 区域**不完整** ⇒ 区域外那部分地表仍由**地表网格**绘制，且**打不穿**（ADR 0004 硬约束 2）
#      ⇒ 玩家会看到"有的地面能挖、有的不能"的割裂感，与"整套地表都是可挖材质"的目标相违；
#   ② 地表四边形只有在**四角都可挖**时才交给体积网格（ADR 0011），故区域**边界那一圈**
#      会同时被地表与体积绘制（共面重叠，可能轻微 z-fighting）。铺满整张地图后这一圈被推到
#      世界边缘（玩家通常看不到）⇒ 顺带把该已知限制移出视野。
#
# 代价（本轮已登记的取舍，见 devlog 2026-09-27 第二条）：
#   ① 整张地表改由 **Surface Nets** 绘制 ⇒ 1 格台阶 / 陡坎的**法线**比地表网格"软"
#      （几何位置仍在 1 格精度内；Surface Nets 不保留锐边，见 ADR 0007）；
#   ② 角色碰撞**仍是高度场**（体积物理未做，见阶段计划 T8 降级项）⇒ 洞口的视觉与碰撞不一致。
#
# 与地图耦合：本文件的水平范围是按 `test_range.toml` 的 `tile_radius = [1, 1]` 手写的。
#   换地图 / 改 tile_radius 时必须同步本文件（世界边界是自动推导的，可挖区域不是）。
[[region]]
name = "test_world_all"
mode = "diggable"
priority = 10
min = [-64, 0, -64]
max = [128, 287, 128]
