# 地表材质表（splat 权重混合 + 分层贴图 + PBR 四件套）
#
# 依据：docs/adr/0004-hybrid-layered-world-representation.md（地表材质 = 多纹理权重混合）、
#       docs/adr/0005-config-parsing.md（TOML + toml++，启动期一次性加载）、
#       docs/adr/0008-sizes-precision-budget.md（高度范围 0~512 格）、
#       docs/adr/0009-terrain-material-pipeline.md（权重逐像素算 + 分层 albedo/法线贴图）、
#       docs/adr/0010-render-quality-pipeline.md（P2：PBR + 材质四件套 albedo/normal/roughness/AO + 宏观变化）。
#
# 权威解释在代码：字段语义与权重模型见 world/terrain/material_table.hpp 与
# world/terrain/material_blender.hpp。本文件只提供数值。
#
# 权重模型（每个片元，逐像素；公式在 assets/shaders/mesh.frag，与 CPU 侧
# world/terrain/material_blender.cpp 的 ComputeBlendWeights 逐字镜像）：
#     weight[slot] = heightFactor * slopeFactor
#   heightFactor = 高度落在 [height_min, height_max] 的窄带平滑隶属度（过渡带宽度 height_blend）
#   slopeFactor  = 坡度落在 [slope_min, slope_max] 的窄带平滑隶属度（过渡带宽度 slope_blend）
#   四个槽位的权重会整体归一化（和 = 1）；过渡带宽由这里的 *_blend 决定，
#   因此不再受 1 格顶点间距限制（ADR 0009：边界窄带化）。
#
# 本表是 CPU 与 GPU 的**唯一事实来源**：这些数值由 BuildMaterialUniform 打包成
# 片元着色器的 std140 uniform 块（高度带 / 坡度带 / uv_scale / tint / roughness / ao /
# 宏观变化参数全部来自这里），禁止在着色器里另写一份。
#
# 约束（加载时校验，违反即中止启动）：
#   - 槽位数量必须等于纹理数组层数（4）；
#   - texture_layer ∈ [1, 255]：0 号层保留给"缺失纹理"占位；
#   - 0 ≤ slope_min ≤ slope_max ≤ 1（坡度为 1 - normal.y）；
#   - *_blend ≥ 0；height_min ≤ height_max；
#   - uv_scale > 0；tint_r/tint_g/tint_b ∈ [0, 1]；
#   - roughness ∈ [0, 1]：PBR 粗糙度（0 = 镜面、1 = 完全漫反射）。地表为**电介质**，不引入
#     metallic（保持范围最小化）；最终粗糙度 = 本值 × 粗糙度贴图的 ±20% 逐像素变化，
#     并在着色器中钳到下限 0.045（避免 GGX 的 alpha → 0 除零）；
#   - ao ∈ [0, 1]：环境光遮蔽系数，**只作用于天空光 / 半球光**（不作用于直接光，避免压黑受光面）；
#     最终环境项系数 = 本值 × AO 贴图（逐像素）；
#   - macro_uv_scale > 0：宏观变化贴图的 UV 尺度（世界格 → 贴图 UV 的重复次数）。
#     必须**显著小于** uv_scale（约 1/5 ~ 1/6），使宏观变化以远大于基础贴图的尺度起伏，
#     用于打破 10 格量级的平铺重复感；
#   - macro_strength ∈ [0, 1]：宏观调制强度（乘在 albedo 与 roughness 上，围绕 1 上下浮动）。
#   - **（T43 / [ADR 0016](../docs/adr/0016-collapse-realism-impulse-material-debris.md)，四个新字段均可选）**
#     `density` > 0（每格³ 质量，水 = 1.0）、`friction` ∈ [0, 1]、`restitution` ∈ [0, 1]、
#     `indestructible`（bool）。它们**不参与地表着色**，只决定**倒塌整体 / 碎块**的质量、摩擦、弹性，
#     以及"小碎片清除"的守卫（`indestructible = true` 的分量不删）。缺省值与旧版全局口径等价（岩 2.6 /
#     土 1.5 / 草 1.3 / 沙 1.6，摩擦与弹性见各层），故**不升 schema_version**（口径同 `subsurface`）。
#     **T52 起 `indestructible = true` 的完整语义**（ADR 0013）：该材质的采样**永不被挖除**
#     （爆炸的伤害预算对它**跳过且不消耗**，`CarveByDamage` / 碎块补丁雕刻都跳过）⇒ **挖不出洞、打不碎**；
#     但密度 / 碰撞 / 命中判定不受影响 ⇒ 仍会挡光球、仍会因失去支撑而作为刚体倒塌。
#   - **（T46 / [ADR 0017](../docs/adr/0017-landing-by-material-rigid-vs-granular.md)，可选）**
#     `rigid_debris`（bool，缺省 false）：**碎块落地后的表示**。
#     `true` = **刚性**（岩这类固体）：碎块落地后**保留几何体** —— 不体素化回写、形状与外观**逐像素不变**
#     （光球打到它时才会惰性体素化，见 ADR 0017）；`false` = **散体**（泥土 / 草 / 沙）：落地后体素化
#     回写**与地面融合**，并**接地沉降**（不允许"下方为空"的悬空体素）。
#   - **（T31 / [ADR 0013](../docs/adr/0013-destructible-elements.md)，**必填** ⇒ v4 → v5）**
#     `toughness` ≥ 0（点 / 格³）：爆炸的**伤害预算**（`projectiles.toml` 的 `damage` × `destruction.toml` 的
#     `points_per_cubic_block`）**逐格³ 扣减**本值 —— 越硬，同一次爆炸挖出的腔体越小；`0` = **不可破坏**
#     （永不被挖除、且不消耗预算）。**必填**：缺失 / 负值 / 非数即中止启动（缺省会悄悄退化成"到处一样硬"）。
#     与 `indestructible = true` 的关系（T52）：两者都表示"不可破坏"，`indestructible` 是**显式开关**
#     （岩用它）；`0` 只是数值上的等价写法。本值**不参与地表着色**，不进 GPU uniform。
#
# ---------------------------------------------------------------------------
# 高度 / 坡度带的覆盖（缺陷 2 修复）：新带参数表与理由
# ---------------------------------------------------------------------------
# 契约：权重模型是「每层 = 高度带隶属度 × 坡度带隶属度」的乘积再归一化；兜底分支（"无槽位匹配 → 槽位 0"）
#   只应给异常输入用，**不得在正常地形上大面积触发**。旧带的问题：平地（坡度 0）只有草（高度 ≤112）与
#   沙（高度 ≤9）覆盖，高度 >112 的平地四层全 0 ⇒ 落兜底 ⇒ 整片平地强制涂成草色。
#
# 新带（单位：格 / 无量纲坡度；slope = 1 - |N.y|）：
#
#   槽位 名称   高度带 [min, max] blend   坡度带 [min, max] blend   角色
#   0    草      [0, 320]        60        [0, 0.45]        0.10     低中海拔 / 缓坡（含测试地图基底 120）
#   1    土      [300, 512]      60        [0, 0.55]        0.10     高海拔缓坡（碎石土）
#   2    岩      [0, 512]        0         [0.55, 1.0]      0.10     **陡坡一律露岩（与高度无关）**
#   3    沙      [0, 6]          3         [0, 0.30]        0.10     低洼滩地
#
# 设计要点（覆盖 + 三条观感意图，含一条明确的取舍）：
#   1. **覆盖完整（无空洞）**：任意 (高度, 坡度) 至少一层权重非零 ——
#      坡度 ≤ 0.45 时，草覆盖高度 ≤ 380、土覆盖高度 ≥ 240，两者在 240~380 重叠 ⇒ 任意高度都被覆盖；
#      坡度 ≥ 0.55 时岩恒为 1；坡度 0.45~0.55 由草的下降段与岩的上升段交叠覆盖。
#   2. **平台平地是「纯草」而不是「草岩灰」**：岩的坡度带下界为 0.55（**不含 0**），故 (120, 0) 处
#      土与岩均为 0、草为 1.0。⚠ 这是本表**最容易被改坏**的一条：一旦让岩的坡度带包含 0（哪怕是
#      "为了覆盖低处陡坡"），平台立刻变成草:岩 ≈ 1:1 的灰绿混合。
#   3. **陡坡一律露岩（与高度无关）**：岩的高度带覆盖全域 ⇒ **低海拔的陡壁同样是灰岩**，而不是"低处是土"。
#      这同时**消除了平台的宽棕环**：低中海拔不再有土的中坡带，坡沿是"草 →（窄过渡）→ 岩"。
#   4. **取舍（已选定）**：草的高度带止于 320（blend 60），h ≥ 380 的缓坡由土（高山碎石土）主导 ——
#      即"高海拔偏土"而非旧版的"高海拔偏岩"。原因是"高海拔**平地**呈岩"要求岩的坡度带包含 0，
#      而那会同时把平台涂成灰绿（见第 2 点）。两者不可兼得，**选了观感上更常见的"平台纯草 + 陡壁灰岩"**；
#      若日后要"高山雪线/岩顶"，须**新增第 5 层**（materials 槽位与纹理数组层数都要改，须另立任务）。
#   5. "窄带"约束（2·blend < 世界高度范围的一半 = 256）仍满足：各层最大 blend 为 60。
#
# 兜底分支仍保留（见 world/terrain/material_blender.cpp 与 assets/shaders/mesh.frag 的警示注释）：
#   触发它意味着**本表的带出现空洞**，属配置错误，应回查本节的覆盖论证。

schema_version = 5

# 槽位 0：草 —— 低中海拔 / 缓坡（含测试地图基底 120 格）；细密叶丛
[[layer]]
name         = "grass"
texture_layer = 1
height_min   = 0.0
height_max   = 320.0
height_blend = 60.0
slope_min    = 0.0
slope_max    = 0.45
slope_blend  = 0.10
uv_scale     = 0.12
tint_r       = 0.31
tint_g       = 0.55
tint_b       = 0.24
roughness    = 0.90
ao           = 0.85
macro_uv_scale = 0.020
macro_strength = 0.35
# ADR 0014：在**可挖体积**里替代本层的材质（"表层 → 次表层"）。
# 草只该出现在地表薄层，故挖开草地看到的应是土；岩 / 土的 subsurface 写自身名。
subsurface     = "dirt"

# ---- T43 / ADR 0016：**物理参数**（倒塌整体 / 碎块的刚体属性；四个字段均可选，缺省见材料表头）----
# density = 每格³ 质量（水 ≈ 1.0）；friction ∈ [0,1]；restitution ∈ [0,1]（0 = 完全不回弹）；
# indestructible = 不可破坏（**本轮只用于"小碎片清除"的守卫**；完整语义待 ADR 0013 / T31）。
# 取值参照真实材料（松散土 ~1.5 t/m³、花岗岩 ~2.6 t/m³；岩的摩擦 ~0.7、沙 ~0.5）。
density        = 1.3
friction       = 0.75
restitution    = 0.02
indestructible = false
# T46：草 = 散体（碎块落地后回写并与地面融合）
rigid_debris   = false
# T31 / ADR 0013：**坚固度**（点 / 格³）—— 爆炸的伤害预算**逐格³ 扣减**本值；越大越难挖，0 = 不可破坏。
toughness      = 2.0

# 槽位 1：土 —— **高海拔缓坡（碎石土）**。低中海拔不再有"中坡过渡带"（见文件头覆盖论证第 3 点：
#   那条中坡带正是平台边缘"一圈土色"的来源）
[[layer]]
name         = "dirt"
texture_layer = 2
height_min   = 300.0
height_max   = 512.0
height_blend = 60.0
slope_min    = 0.0
slope_max    = 0.55
slope_blend  = 0.10
uv_scale     = 0.10
tint_r       = 0.45
tint_g       = 0.33
tint_b       = 0.21
roughness    = 0.88
ao           = 0.75
macro_uv_scale = 0.015
macro_strength = 0.40
subsurface     = "dirt"
density        = 1.5
friction       = 0.60
restitution    = 0.02
indestructible = false
# T46：土 = 散体（碎块落地后回写并与地面融合）
rigid_debris   = false
# T31 / ADR 0013：坚固度（锚点：项目所有者给的"泥土 3"；配合换算系数 271 ⇒ 光球在纯泥土中挖出 r ≈ 6 格）。
toughness      = 3.0

# 槽位 2：岩 —— **陡坡一律露岩（与高度无关）**；粗糙开裂。
#   **关键**：坡度带下界为 0.55（**不含 0**），所以平台平地（坡度 0）上岩的权重严格为 0；否则平台会变成
#   "草:岩 ≈ 1:1" 的灰绿混合（上一版即如此，已被否决）。粗糙度最低 ⇒ 在镜面方向产生
#   **可分辨的方向性高光**
[[layer]]
name         = "rock"
texture_layer = 3
height_min   = 0.0
height_max   = 512.0
height_blend = 0.0
slope_min    = 0.55
slope_max    = 1.0
slope_blend  = 0.10
uv_scale     = 0.16
tint_r       = 0.55
tint_g       = 0.55
tint_b       = 0.56
roughness    = 0.40
ao           = 0.70
macro_uv_scale = 0.030
macro_strength = 0.30
subsurface     = "rock"
density        = 2.6
friction       = 0.70
restitution    = 0.12
# **T52（2026-09-28，项目所有者指定）：岩 = 完全不可破坏** ——"岩石材质修改为完全无法击毁无法挖洞，
# 具备物理引擎能够被光球打到"。即：爆炸的伤害预算**一律不作用于岩体**（`CarveByDamage` 对
# `indestructible` 的采样**跳过且不消耗预算**）⇒ 岩里挖不出洞、岩石碎块上的雕刻也挖不动（T50 的
# `CarveCollapseUnitPatch` 同样跳过）；而**密度 / 碰撞 / 命中判定完全不变** ⇒ 光球仍会打在岩石上、
# 岩石仍会失去支撑并作为刚体倒塌（那不算"破坏"）。
# 想恢复"可挖的硬岩"只改这一行：`indestructible = false`（`toughness = 5.0` 仍是可挖时的坚固度）。
indestructible = true
# T46：岩 = **刚性** —— 碎块落地后保留几何体（不回写、不变形）；T50 起命中它时在**自身补丁上雕刻**
# （但 T52 之后 indestructible ⇒ 实际挖不动，只会挡住光球）
rigid_debris   = true
# T31 / ADR 0013：坚固度（锚点：项目所有者给的"岩石 5"；配合换算系数 271 ⇒ 同参数下 r ≈ 5.06 格）。
# **T52 起不再生效**（上面已置 `indestructible = true`，结算时被跳过）；保留本值是为了"改回 false 即恢复"。
toughness      = 5.0

# 槽位 3：沙 —— 低洼滩地；细颗粒
[[layer]]
name         = "sand"
texture_layer = 4
height_min   = 0.0
height_max   = 6.0
height_blend = 3.0
slope_min    = 0.0
slope_max    = 0.30
slope_blend  = 0.10
uv_scale     = 0.18
tint_r       = 0.83
tint_g       = 0.74
tint_b       = 0.48
roughness    = 0.95
ao           = 0.90
macro_uv_scale = 0.025
macro_strength = 0.25
subsurface     = "dirt"
density        = 1.6
friction       = 0.50
restitution    = 0.05
indestructible = false
# T46：沙 = 散体（碎块落地后回写并与地面融合）
rigid_debris   = false
# T31 / ADR 0013：坚固度（本实现补齐：砂比黏土更松散易挖；草同理 2.0）。
toughness      = 2.0

# ---------------------------------------------------------------------------
# 全局三平面（triplanar）：陡壁 UV 拉伸 —— 按坡度自动切换的混合投影（C 项）
# ---------------------------------------------------------------------------
# 依据：ADR 0009「不在本次范围：陡壁三平面映射」、ADR 0010「切换条件：近景岩壁 UV 拉伸 ⇒ 局部先上 triplanar」，
#   现由项目所有者批准实施。设计约束：**自动切换**（地形可被笔刷挖 / 堆，权重必须逐像素由世界空间法线算，
#   禁止 CPU 侧预烘焙 / 按 tile 分支 / 需重建网格），且**平地路径零额外采样**。
#
# 口径与取值范围：
#   - enabled：true 启用、false 时着色器整段跳过三平面（退回纯平面投影）。
#   - slope_min ∈ [0, 1)：自动切换**下界**。坡度 slope = 1 - |N.y|（0 = 水平面、1 = 竖直面）。
#       slope ≤ slope_min → 混合权重 0 → **纯平面路径（与旧版采样次数完全相同）**。
#   - slope_max ∈ (slope_min, 1]：自动切换**上界**。slope ≥ slope_max → 混合权重 1 → 完全三平面。
#       必须满足 0 ≤ slope_min < slope_max ≤ 1（否则 smoothstep 退化，加载即报错）。
#   - sharpness > 0：三轴投影的锐化指数（越大越"只取最贴合的那一两个轴"）。
#   混合权重 = smoothstep(slope_min, slope_max, slope)，与 CPU 纯函数 TriplanarBlendWeight 逐字镜像。
#
# 性能取舍（写入注释备查）：
#   - 平地早退：混合权重 ≤ ε 时**只做 1 次平面采样**，不进入三平面分支；
#   - 三平面**只作用于权重最高的那一层**（与 T23 多频细节法线同一判据），且**只作用于 albedo 与 normal**；
#     roughness / AO / macro / 细节法线**保持平面投影**（它们在陡壁上的视觉影响小，可为每层省下 2 次采样）；
#   - 不新增纹理、不新增 render pass。
#   - 0.45 / 0.70：坡度约 62° 起开始混入、约 78° 完全切换（1 - cos 角），覆盖测试地图的岩壁而不影响缓坡。
[triplanar]
enabled   = true
slope_min = 0.45
slope_max = 0.70
sharpness = 4.0
