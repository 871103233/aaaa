# 世界清单 B：**预制小世界**（≈1×1 km，[ADR 0028](../../docs/adr/0028-world-families-and-static-asset-first.md) §一）
#
# 数据来源 = `premade`：世界几何来自**离线烘焙**的预制文件（ADR 0026 的容器，由 `tools/baker/` 产出）。
#   V1 只校验 [premade_file] **非空**；文件的存在性与格式校验发生在**实际加载世界时**（V4）——
#   预制文件是离线产物（不入库），此刻可能尚未生成。

schema_version = 1
id   = "world_b"
name = "预制小世界 B（1×1 km）"

family = "instance_premade"
source = "premade"
premade_file   = "world_b.vxmap"
terrain_preset = "world_b_terrain.toml"
objects_file   = "world_b_objects.toml"   # V3：本世界的物件 / 传送门放置清单（相对本文件目录）

destruction_enabled     = true   # 破坏策略：部分元素可破坏（范围比 A 大）
persistent              = true   # 存档策略：按用途持久化（剧情存；存档未开始，先登记）
randomize_seed_on_entry = false
