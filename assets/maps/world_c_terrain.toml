# 地形预设：**随机小世界 C 的地形**（≈1×1 km；被 assets/maps/world_c.toml 引用）
#
# 坐标口径：tile 半径 [8, 8] ⇒ 世界列 [-512, 512] = 1024 格 ≈ 1×1 km。
# `seed` 是**基准种子**：世界清单 C 开了 `randomize_seed_on_entry` ⇒ V5 起每次进入会用**当次种子**覆盖它
#   （然后把当次种子记录下来，保证"同种子可复现"）。
# `edits` 保持为空：肉鸽世界的地形应完全由种子决定，不手工编辑。

schema_version = 1
name           = "随机小世界 C 的地形（1×1 km；种子在进入时决定）"
seed           = 1
tile_radius    = [8, 8]
spawn          = [0.0, 0.0]
