# 世界清单 C：**随机小世界**（≈1×1 km，肉鸽，[ADR 0028](../../docs/adr/0028-world-families-and-static-asset-first.md) §一）
#
# 数据来源 = `procedural`：按**种子**运行期生成。
# `randomize_seed_on_entry = true` ⇒ **首次进入时随机生成"秘境实例种子"**（V5 消费）；
#   之后**反复进入复用该种子**（⇒ 同一个世界），直到被**重置 / 销毁**（V9 菜单的「重置」）。
#   ⚠️ 语义收紧（2026-10-06 所有者裁定）：**不是**"每次进入都换种子"——那会让"反复进入一样"不成立。
# `persistent = true` ⇒ **退出即保存**（世界状态随 `.voxr` 落盘、物件随可编辑层落盘）。
#   **丢弃时机 = 玩家主动「重置」**（V9 菜单，换种子 ⇒ 旧档因**种子不匹配**被忽略，见 ADR 0037 决策六的校验路径）
#   或未来其他重置时机。**2026-10-07 所有者裁定**：肉鸽地图的**内容退出要保存**，丢弃时机为主动重置。

schema_version = 1
id   = "world_c"
name = "随机小世界 C（1×1 km，肉鸽）"

family = "instance_roguelike"
source = "procedural"
terrain_preset = "world_c_terrain.toml"
objects_file   = "world_c_objects.toml"   # V3：本世界的物件 / 传送门放置清单（相对本文件目录）

destruction_enabled     = true   # 破坏策略：可破坏范围最大
persistent              = true   # 退出即保存；丢弃 = 主动重置（换种子）
randomize_seed_on_entry = true
