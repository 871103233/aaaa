# 物件放置清单：**大世界 A**（被 assets/maps/world_a.toml 的 `objects_file` 引用）
#
# 内容（V8，[ADR 0028](../../docs/adr/0028-world-families-and-static-asset-first.md) §一「差异全部落在清单」）：
#   - **两个传送门**（V3）：走到附近按 `E` 切到目标世界（B / C）——**不自动切换**；
#   - **自然物**（V8）：从公共 CC0 素材（Kenney《Nature Kit》，见 NOTICE.md 台账）选抽的 **12 个低模**，
#     在出生平台附近**程序化散布**（`[[scatter]]`，确定性抖动网格）+ 一个**小营地**（营火 + 木栅，显式摆放）；
#   - 一个**土堆对照**（可破坏，用于验证"破坏按类型分流"，V6）。
#
# 口径：
#   - `[[placement]]` 的 `position` = **底面中心的世界列坐标**（格），Y 由地表高度求解（本文件的 y 分量不生效）；
#   - `[[scatter]]` 由**纯函数**生成平面点 + 朝向（同 seed 逐位可复现），Y 同样由地表高度求解；
#   - `kind = "model"` 的类型必须给出 `model_file`；`half_extent` 是**目标包围盒半尺寸**
#     （模型**等比**缩放到"装进"该盒 ⇒ 想等比放大，三个分量按模型原始比例给，见下）；
#   - `material_slot`（仅 model）= 逐顶点**地表材质槽位**（0 草 / 1 土 / 2 岩 / 3 沙）。
#     **本阶段模型自带贴图不出**（渲染器只有地表 4 槽材质）⇒ 树给草槽、岩石给岩槽、木器给土槽（见 plans/v0.5.md §1.9）。
# **待补（世界观，SKILL 六.9）**：门的命名与解释待所有者提供（见 docs/world-setting.md §3）；自然物为**通用自然物**，无需设定。

schema_version = 1
destructible_enabled = true

# ---------------------------------------------------------------------------
# 类型表
# ---------------------------------------------------------------------------

[[type]]
id = "portal_gate"
kind = "portal"
half_extent = [1.0, 1.5, 0.2]   # 门洞半宽 0.6 格、半高 1.1 格（环心线 = 半尺寸 − 管半径）
destructible = false            # 传送装置不可破坏

[[type]]
id = "dirt_pile"
kind = "dirt_pile"
half_extent = [1.0, 0.75, 1.0]
destructible = true

