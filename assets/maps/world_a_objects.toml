# ---------------------------------------------------------------------------
# V0.8：**模块化建筑 kit**（代理体；ADR 0035）—— 统一模数 4.0 格，可直接拼成没有错缝的房间
# ---------------------------------------------------------------------------
# 口径：`kind = "kit"` 必须给 `kit_role` 与 `module_blocks`；水平占地必须是模数的**整数倍**
# （解析期强制，非法即抛）⇒ 相邻构件的接缝错位恒为 0。墙 / 门洞墙的高 = 2*half_extent.y = 3.0 格，
# 门洞净高 2.2 格 > 角色总高 1.80 格 ⇒ **可进入**（由 BuildKitPieceMesh 的几何保证）。
# **代理体**：正式 kit 美术资产未引入（ADR 0035 决策二：先用程序化代理体，备选 CC0 近风格 kit）。

[[type]]
id = "kit_floor"
kind = "kit"
kit_role = "floor"                   # 地板：厚 0.30 格，顶面 = 可站面
half_extent = [2.0, 0.15, 2.0]       # 水平 4.0 × 4.0 = 1 个模数格
module_blocks = 4.0
destructible = false
category = "building"

[[type]]
id = "kit_wall"
kind = "kit"
kit_role = "wall"                    # 墙：高 3.0 格、厚 0.30 格（沿局部 Z 居中）
half_extent = [2.0, 1.5, 2.0]
module_blocks = 4.0
destructible = false
category = "building"

[[type]]
id = "kit_wall_door"
kind = "kit"
kit_role = "wall_door"               # 带门洞的墙：洞口宽 1.6 / 净高 2.2 格
half_extent = [2.0, 1.5, 2.0]
module_blocks = 4.0
destructible = false
category = "building"

[[type]]
id = "kit_roof"
kind = "kit"
kit_role = "roof"                    # 屋顶：厚 0.30 格
half_extent = [2.0, 0.15, 2.0]
module_blocks = 4.0
destructible = false
category = "building"

