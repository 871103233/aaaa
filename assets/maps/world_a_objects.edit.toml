# 可编辑层：**手工摆放静态资产**的落点（阶段 V0.5 的 E1）。
#
# 与发布清单（world_a_objects.toml）**分开存、叠加读**：本文件在发布清单之后加载，
# 其 `[[type]]` / `[[placement]]` / `[[scatter]]` **按文件顺序追加**（确定性，红线 7）。
# 规则（非法即抛）：① 类型 id 不得与发布清单重复；② `destructible_enabled` 必须与发布清单一致。
#
# 用法：进入该世界（`--world=world_a`），走到想摆放的位置、对准地面按 `F2`
# —— 日志会给出**可直接粘贴**的 `[[placement]]` 片段（含类型 / 坐标 / 朝向），粘到本文件末尾即可。
# 想换放置类型：启动参数 `--place-type=<type id>`（缺省 = 该世界类型表首项）。
#
# 示例（取消注释即可）：
# [[placement]]
# type = "tree_default"
# position = [12.0, 0.0, 8.0]
# yaw_deg = 90.0

schema_version = 1
destructible_enabled = true
