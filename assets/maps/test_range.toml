# 手工测试地图：test_range（T11）
#
# 用途：给"走 / 跳 / 上坡 / 上台阶 / 飞行 / 挖 / 堆"提供一张**可预期**的测试场：
#   - 出生平台       —— 平地，角色出生处；
#   - 阶梯坡道       —— 从低地(120)一级一级升到高台(130)，每级 1 格，可自动上台阶；
#   - 1 格台阶平台   —— 单级 1 格高台，专门验证"1 格自动上步"；
#   - 陡坡台阶区     —— 每级 2 格，超过自动上台阶高度与最大坡度，应上不去（测最大坡度限制）；
#   - 深坑           —— carve 出一处 24 格深方坑，测挖/堆与"站在洞里"；
#   - 地标塔         —— 3×5 列、高出高台约 130 格的醒目方柱，供玩家定位方向。
#
# 坐标口径：min / max / spawn 都是**世界列坐标（格）**，闭区间；tile 坐标范围为 [-1, 1]，
# 即世界列 [-64, 64]。高度单位为格。编辑按文件顺序依次应用，噪声先生成、编辑覆盖其上。
#
# 权威解释在代码：字段语义与校验见 world/generation/map_preset.hpp。

schema_version = 1
name           = "手工测试地图：阶梯坡道 / 台阶 / 陡坡 / 深坑 / 地标塔"
seed           = 1592594996  # 0x5EED1234，与旧场景一致的种子
tile_radius    = [1, 1]
spawn          = [0.0, 0.0]

# ---- 基底：先把整张图压平到 120 格，得到干净、可预期的测试床 ----
[[edit]]
name   = "ground_base"
mode   = "flatten"
min    = [-64, -64]
max    = [64, 64]
height = 120.0

# ---- 出生平台（平地上的平整区域，出生点 (0,0) 落在其中）----
[[edit]]
