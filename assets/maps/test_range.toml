# ---- 山体（T8 / T27）：一座 80 格高、四壁近乎直立的台地，用于验证
#      "从山侧面射入光球 → 在山体上挖出一个洞"。
#      注：可挖区域已扩展为**整张地图的地表**（见 assets/config/dig_regions.toml），故本山体
#      不再是"唯一可挖的地方"，而是保留下来作为一处**高而薄的竖直壁面**——
#      打竖直壁最容易看出"掏出来的是三维洞体"而不是"把高度削平"。
#      位置在 x ∈ [6, 26]、z ∈ [-56, -36]：这是唯一没有其它编辑的区域
#      （出生平台 z ≥ -20、陡坡台阶 z ≥ 28、高台 x ≥ 35），从而不干扰既有测试面。
[[edit]]
name   = "dig_hill"
mode   = "flatten"
min    = [6, -56]
max    = [26, -36]
height = 200.0

