# 方块注册表（初版）
#
# 依据 docs/tech-plan-v1.3.md §4.1：
#   方块属性不随方块实例重复存储，启动时一次性载入全局 BlockRegistry。
#
# 字段说明：
#   id           方块 ID。会被存档中的调色板引用，**一经分配不得修改或复用**
#   name         唯一名字（日志/调试用）
#   solid        是否阻挡玩家与实体
#   opaque       是否完全不透光（同时影响面剔除与光照传播）
#   light_level  自发光等级 0~15（15 为最高）
#   texture      纹理数组层号，-1 表示不渲染（见 assets/textures/layers.toml）
#   hardness     破坏耗时基准（秒）；-1 表示不可破坏

[[block]]
id = 0
name = "air"
solid = false
opaque = false
light_level = 0
texture = -1
hardness = -1

